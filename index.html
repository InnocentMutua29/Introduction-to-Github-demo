<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to Git and GitHub</title>
</head>
<body>
    <h1>GIT AND GITHUB TUTORIAL</h1>
    <p>This is my first project under Git and GitHub tutorial</p>
    <h2>An iframe</h2>
    <iframe src="example.com" frameborder="0" style="width: 300px; height: 400px; background-color: aqua;"></iframe>
    <h3>HTML FORMS</h3>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="First Name"><br>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="Last Name"><br>
            <label for="age">Age:</label>
            <input type="text" id="age" name="Age"><br>
            <label for="gender">Gender:</label>
            <select name="gender" id="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select><br>
            <label for="qualification">Qualification:</label>
            <input type="text" list="qualif">
            <datalist id="qualif">
                <option value="Certificate">Certificate</option>
                <option value="Diploma">Diploma</option>
                <option value="Degree">Degree</option>
                <option value="Masters">Masters</option>
            </datalist>
        </fieldset>
    </form>

    
</body>
</html>
